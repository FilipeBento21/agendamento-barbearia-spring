server:
  port: 8080

spring:
  application:
    name: agendamento-barbearia
  datasource:
    url: jdbc:h2:mem:projetodb
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: America/Recife
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss

springdoc:
  swagger-ui:
    path: /swagger-ui.html